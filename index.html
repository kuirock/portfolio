<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Presentation Tool</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>
</head>
<body>
  <!-- Canvas for Agent 1 -->
  <canvas id="glitchCanvas"></canvas>

  <!-- Slide container for Agent 2 -->
  <div id="slideContainer" class="slide-container"></div>

  <!-- Control panel for Agent 2 -->
  <div id="controlPanel" class="control-panel">
    <button id="prevBtn">Prev</button>
    <span id="slideIndicator">Slide 1 / 1</span>
    <button id="nextBtn">Next</button>
    <button id="addTextBtn">+ Text</button>
    <button id="addShapeBtn">+ Shape</button>
    <input type="file" id="imageInput" accept="image/*" style="display: none;">
    <button id="addImageBtn">+ Image</button>
    <button id="delSlideBtn">Del Slide</button>
    <button id="undoBtn">Undo</button>
    <input type="color" id="colorPicker" title="Change Color" value="#00f2ff">
    <button id="saveBtn">Save</button>
    <button id="exportBtn">Export PPTX</button>
  </div>

  <!-- Property Panel for Agent 3 -->
  <div id="propertyPanel" class="property-panel" style="display: none;">
    <div class="panel-group">
      <label>Font:</label>
      <select id="fontSelect">
        <option value="'Courier New', Courier, monospace">Courier</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="'Times New Roman', serif">Times</option>
      </select>
    </div>
    <div class="panel-group">
      <label>Size:</label>
      <input type="number" id="fontSizeInput" min="10" max="200" value="24">
    </div>
    <div class="panel-group">
      <label>Weight:</label>
      <select id="fontWeightSelect">
        <option value="normal">Normal</option>
        <option value="bold">Bold</option>
      </select>
    </div>
    <div class="panel-group">
      <button id="frontBtn">Bring to Front</button>
      <button id="backBtn">Send to Back</button>
    </div>
  </div>

  <!-- Custom Context Menu for Image Trimming -->
  <div id="contextMenu" class="context-menu" style="display: none;">
    <div id="cropOption" class="context-menu-item">Toggle Crop Mode</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
